# Compact-form ladder -- does the toc's JSON envelope cost anything, and does cutting it change what
# the agent does? Tool delivery only: the agent calls toc_dir itself, in one of two output forms.
#
# Measured at the pin (2026-09-02): a 25-file `toc dir` is 10.9 KB as JSON -- 69% header-comment prose,
# 22% keys and booleans repeated on every entry -- and 3.1 KB compact (one line per file, first
# sentence of the header, 120-char cap). The compact form keeps every line number, so it is the same
# map. The 2026-09-02 toc ladder established toc_dir as the one rung that pays (turns 8 -> 4,
# cache_read 127k -> 83k, recall unchanged, on task 01); this ladder asks whether the same win comes
# cheaper still.
#
# Ladder a -- task 01, unfamiliar two-package exploration, reps 2. The ids for a0/a2 match the toc
# ladder's, so the two roots line up cell for cell on this host -- but that ladder ran reps 5, so this
# one is the cheaper probe, not its equal: two reps show a large form effect and the byte sizes, and
# cannot separate a small one from run-to-run noise. Raise reps here if a9 vs a2 comes out close.
#   a0-none              control
#   a2-toc-dir           the tool, JSON form forced (toc_format: json -- the agent cannot opt into compact)
#   a9-toc-dir-compact   the tool, compact form forced (toc_format: compact)
#
# Both tool cells pin toc_format explicitly because the server's toc tools advertise a `compact: true`
# input: without the pin an agent in the JSON cell can opt in on its own (two reps did exactly that in
# the toc ladder) and the cell measures a mix. Both cells see the same tool description.
#
# Reading the result: a9 vs a2 is the form pair, same material, different bytes. Expected:
# cache_creation and cache_read drop (the 49 KB JSON toc result becomes ~12 KB), turns stay at 4,
# recall stays ~0.42. If turns or recall move, the form changed the agent's behaviour, not only its
# bill -- in which case check the transcripts for whether the agent read more files (the compact form
# carries one sentence per file, JSON the whole first paragraph). Compare cost within this root only;
# correctness by id against results/2026-09-02-toc and results/2026-08-30 is allowed.
#
# Injected (annex) delivery of the compact form is deliberately not here -- see HANDOFF.md "Deferred".
#
# Run with: bench/loomyard-eval/ladder/run-compact.sh   (results land in results/<date>-compact)

run_model: claude-sonnet-5
reps: 2
run_effort: medium
max_turns: 60

# "compact2", not "compact": a first attempt at this ladder was stopped mid-flight and left one subagent
# transcript under the projects-tree directory that "compact-a0-none-1" mangles to. LocateTranscript
# hard-errors on two metadata files sharing a description, and a re-run reproduces the description
# exactly (config id, repetition, attempt index), so re-using the old template would fail ingest on the
# first repetition. Bumping the prefix gives every session a fresh projects-tree directory and leaves the
# stale one where it lies. Bump again -- never delete under ~/.claude -- if a run is ever abandoned here.
session_dir_template: .scratch/ladder-sessions/compact2-{config_id}-{n}

scorer:
  model: claude-opus-5
  effort: high

quarry_tools:
  - toc_dir
  - toc_file
  - textDocument_definition
  - textDocument_references
  - workspace_symbol
  - impact
  - assert_no_callers

tasks:
  01-reed-geometry-exploration:
    task_file: bench/loomyard-eval/tasks/01-reed-geometry-exploration.md
    pinned_sha: 975578cda8d6f3a81580bd4e73725e060211b766
    worktree: /tmp/loomyard-eval-01
    schema: exploration
    fasit: bench/loomyard-eval/tasks/01-reed-geometry-exploration.fasit.json

source_repo: env:LADDER_LOOMYARD_REPO

configs:
  - id: a0-none
    ladder: a
    task: 01-reed-geometry-exploration
    allowed: []
    cold: false
  - id: a2-toc-dir
    ladder: a
    task: 01-reed-geometry-exploration
    allowed: [toc_dir]
    toc_format: json
    cold: false
  - id: a9-toc-dir-compact
    ladder: a
    task: 01-reed-geometry-exploration
    allowed: [toc_dir]
    toc_format: compact
    cold: false
