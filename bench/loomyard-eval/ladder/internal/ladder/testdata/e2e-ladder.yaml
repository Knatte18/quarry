# e2e-ladder.yaml is the synthetic capability-ladder matrix e2e_test.go drives through the four
# post-dispatch stages -- ingest, gates, redaction/scoring, and summarisation -- over the hand-written
# e2e-transcript.jsonl fixture. Every pin LoadLadder/RequirePins/RequireSessionPins can check is set, so
# no test in this package has to supply an override.
#
# Four configs, not two, because LoadLadder's own control-count rule iterates ladder "a" and "b"
# unconditionally: each one must carry exactly one control (empty allowed), regardless of how many
# other configs exist on it, and BuildSummary's own CompareWarmCold errors outright when the ladder
# carries no cold: true config at all. a1-rung is the only config e2e_test.go actually drives a run
# for; a0-none, a1-rung-cold, and b0-none exist purely to satisfy those two structural rules and are
# left with zero runs (both incomplete, the cold cell's own disposition unrecorded), which is itself a
# legitimate state BuildSummary must handle.

run_model: claude-opus-5
reps: 1
run_effort: medium
max_turns: 50

session_dir_template: /tmp/e2e-session-{config_id}-{n}

scorer:
  model: claude-opus-5
  effort: high

quarry_tools:
  - toc_dir
  - toc_file
  - textDocument_definition
  - textDocument_references
  - workspace_symbol
  - impact
  - assert_no_callers

tasks:
  # task_file/pinned_sha/worktree are never read by e2e_test.go -- it passes its own task text and
  # worktree directly rather than through TaskTextFor/EnsureTaskWorktrees -- so task_file points at a
  # real committed task file rather than a fixture that would otherwise dangle unread.
  e2e-task:
    task_file: bench/loomyard-eval/tasks/01-reed-geometry-exploration.md
    pinned_sha: 975578cda8d6f3a81580bd4e73725e060211b766
    worktree: /tmp/e2e-task-worktree
    schema: exploration
    fasit: testdata/e2e-answer-fasit.json

source_repo: /tmp/e2e-source-repo

configs:
  # Ladder A's control -- carries no run in this test; exists only so ladder "a" has exactly one
  # control, as LoadLadder requires.
  - id: a0-none
    ladder: a
    task: e2e-task
    allowed: []
    cold: false

  # The one config e2e_test.go actually drives: e2e-transcript.jsonl is shaped for exactly this
  # allowed set (mcp__quarry__toc_file and mcp__quarry__workspace_symbol tool_use blocks, plus a
  # Bash grep call), so a drift in any downstream field name shows up as a mismatch rather than
  # being silently absorbed.
  - id: a1-rung
    ladder: a
    task: e2e-task
    allowed: [toc_file, workspace_symbol]
    cold: false

  # Cold cell -- carries no run in this test; exists only so CompareWarmCold has a cold config to
  # resolve at all. Its own cell stays incomplete, which is itself part of what BuildSummary's
  # "unknown" cold-disposition path exercises.
  - id: a1-rung-cold
    ladder: a
    task: e2e-task
    allowed: [toc_file, workspace_symbol]
    cold: true
    warm_counterpart: a1-rung

  # Ladder B's control -- carries no run in this test; exists only so ladder "b" has exactly one
  # control, as LoadLadder requires.
  - id: b0-none
    ladder: b
    task: e2e-task
    allowed: []
    cold: false

cold_worktree_template: /tmp/e2e-cold-{n}
