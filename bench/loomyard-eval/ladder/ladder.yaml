# This file is the single declarative source of truth for the quarry-mcp
# capability ladder's 15-config matrix. No other file in this suite writes
# out a config table or a deny-list literal -- every deny-list is derived
# from a config's `allowed` set at load time by internal/ladder's
# DenyListFor.
#
# Two operator-supplied pins are required before the matrix starts:
# `run_model` and `max_turns` (see its own comment below for why the
# latter also ships null). Both ship null and RequirePins refuses every
# gate-dependent subcommand while either is unset.

run_model: claude-sonnet-5
reps: 3
run_effort: medium
# max_turns' meaning is now "maximum number of assistant records in a run's subagent transcript" --
# the old committed 60 was calibrated against a different accounting basis and did not carry over.
# Calibrated from the first real matrix run (b7-bundle rep 1, the full 7-tool bundle, medium effort):
# num_turns was 12 in a clean, successful completion. 60 is that observed value times a 5x margin --
# generous enough that a harder task (the ladder A exploration task in particular, which this first
# calibration run did not exercise) or a rung with fewer tools forcing more manual exploration is very
# unlikely to hit it on a genuinely successful run, while still catching real runaway/looping behavior.
max_turns: 60

# session_dir_template is the per-repetition session working-directory path. `{config_id}` and `{n}`
# are substituted; `{n}` is the 1-based repetition index.
#
# This must live under an already-trusted ancestor directory, not a bare /tmp path: Claude Code treats a
# fresh /tmp directory as an untrusted workspace and silently ignores permissions.allow from its
# settings.json (deny rules still apply), which defeats the point of the fixed Read/Bash allow list
# (prompt-avoidance only -- see settings.go). The quarry repo checkout itself is already trusted from
# ordinary use, and trust inherits to subdirectories, so scratch dirs live under its gitignored .scratch/
# tree -- a plain directory, deliberately not its own git repo (nested git repos need their own trust).
#
# Relative to the quarry repo root, never an absolute machine-specific path (LoadLadder rejects an
# absolute template): every ladderbench invocation runs from the repo root by documented convention (see
# cmd/ladderbench's resolveRepoRoot), and SessionDir joins this template against that resolved root.
session_dir_template: .scratch/ladder-sessions/{config_id}-{n}

scorer:
  model: claude-opus-5
  effort: high

# Canonical seven client-side tool names quarry-mcp exposes, bare (no
# mcp__quarry__ prefix -- that is applied by internal/ladder's MCPName).
# LoadLadder validates this list against QuarryTools and rejects any drift.
quarry_tools:
  - toc_dir
  - toc_file
  - textDocument_definition
  - textDocument_references
  - workspace_symbol
  - impact
  - assert_no_callers

tasks:
  01-reed-geometry-exploration:
    task_file: bench/loomyard-eval/tasks/01-reed-geometry-exploration.md
    pinned_sha: 975578cda8d6f3a81580bd4e73725e060211b766
    worktree: /tmp/loomyard-eval-01
    schema: exploration
    fasit: bench/loomyard-eval/tasks/01-reed-geometry-exploration.fasit.json
  04-shedadapters-shuttle-impact:
    task_file: bench/loomyard-eval/tasks/04-shedadapters-shuttle-impact.md
    pinned_sha: 975578cda8d6f3a81580bd4e73725e060211b766
    worktree: /tmp/loomyard-eval-04
    schema: impact
    fasit: bench/loomyard-eval/tasks/04-shedadapters-shuttle-impact.fasit.json

# Resolved from the LADDER_LOOMYARD_REPO environment variable at the point a session actually needs a
# real Loomyard checkout (LoadLadder requires this literal, ResolveSourceRepo reads the variable) -- never
# a hardcoded machine-specific checkout path, so this same file runs unchanged on any machine that sets
# the variable.
source_repo: env:LADDER_LOOMYARD_REPO

configs:
  # Ladder A -- task 01 (exploration)
  - id: a0-none
    ladder: a
    task: 01-reed-geometry-exploration
    allowed: []
    cold: false
  - id: a1-toc-file
    ladder: a
    task: 01-reed-geometry-exploration
    allowed: [toc_file]
    cold: false
  - id: a2-toc-dir
    ladder: a
    task: 01-reed-geometry-exploration
    allowed: [toc_dir]
    cold: false
  - id: a3-toc-pair
    ladder: a
    task: 01-reed-geometry-exploration
    allowed: [toc_dir, toc_file]
    cold: false
  - id: a4-toc-pair-symbol
    ladder: a
    task: 01-reed-geometry-exploration
    allowed: [toc_dir, toc_file, workspace_symbol]
    cold: false
  - id: a5-bundle
    ladder: a
    task: 01-reed-geometry-exploration
    allowed:
      - toc_dir
      - toc_file
      - textDocument_definition
      - textDocument_references
      - workspace_symbol
      - impact
      - assert_no_callers
    cold: false

  # Ladder B -- task 04 (impact analysis)
  - id: b0-none
    ladder: b
    task: 04-shedadapters-shuttle-impact
    allowed: []
    cold: false
  - id: b1-symbol
    ladder: b
    task: 04-shedadapters-shuttle-impact
    allowed: [workspace_symbol]
    cold: false
  - id: b2-definition
    ladder: b
    task: 04-shedadapters-shuttle-impact
    allowed: [textDocument_definition]
    cold: false
  - id: b3-references
    ladder: b
    task: 04-shedadapters-shuttle-impact
    allowed: [textDocument_references]
    cold: false
  - id: b4-lsp-trio
    ladder: b
    task: 04-shedadapters-shuttle-impact
    allowed: [workspace_symbol, textDocument_definition, textDocument_references]
    cold: false
  - id: b5-impact
    ladder: b
    task: 04-shedadapters-shuttle-impact
    allowed: [impact]
    cold: false
  - id: b6-assert-no-callers
    ladder: b
    task: 04-shedadapters-shuttle-impact
    allowed: [assert_no_callers]
    cold: false
  - id: b7-bundle
    ladder: b
    task: 04-shedadapters-shuttle-impact
    allowed:
      - toc_dir
      - toc_file
      - textDocument_definition
      - textDocument_references
      - workspace_symbol
      - impact
      - assert_no_callers
    cold: false

  # Cold cell -- same tool set as a5-bundle, run against a fresh worktree so
  # no prior run has already started the daemon. Contrasted against its
  # warm counterpart via the declared `warm_counterpart` field, never by
  # parsing this id's `-cold` suffix.
  - id: a5-bundle-cold
    ladder: a
    task: 01-reed-geometry-exploration
    allowed:
      - toc_dir
      - toc_file
      - textDocument_definition
      - textDocument_references
      - workspace_symbol
      - impact
      - assert_no_callers
    cold: true
    warm_counterpart: a5-bundle

# Per-cold-run worktree path, distinct per repetition. `{n}` is the 1-based
# repetition index.
cold_worktree_template: /tmp/loomyard-eval-01-cold-{n}
