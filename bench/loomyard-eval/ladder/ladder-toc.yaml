# Toc-only ladder -- a separate matrix that tests exactly one thing: does a directory-level table of
# contents (toc) pay for itself, and under what scope?
#
# Why this file exists. In the 2026-08-30 matrix, toc was the only rung with a clear effect: on task 01
# (two-package, ~60-file exploration) a2-toc-dir halved the control's turns (9 -> 4) and cache_read
# (154k -> 71k) at unchanged recall/precision (0.36/0.90 vs 0.45/0.88, within n=3 noise). That is a
# cost win, not a correctness win, measured on one task at reps 3. Every other rung was flat or worse.
# This ladder isolates that one signal and adds the missing scope contrast.
#
# Design: eight cells, run by the T2 headless harness (bench/loomyard-eval/ladder/cmd/ladder)
# against the quarry MCP server.
#
#   ladder a -- task 01, exploration over an unfamiliar two-package scope. The condition where toc won.
#       a0-none      control (id identical to the main matrix's for by-id comparison across roots)
#       a2-toc-dir   directory-level toc only (id identical to the main matrix's)
#
#   ladder b -- task 04, impact analysis where the task text names the file. The negative control: the
#   task hands the agent the map, so a toc should have nothing to add. If a toc cell is cheaper here
#   too, the effect is not "map first" but something about how the agent reads; if the agent never
#   calls the tool (the run's per-cell table flags that), the cell measured the tool's prompt cost only.
#       b0-none      control (id identical to the main matrix's)
#       b8-toc-dir   new id (b1..b7 are taken by the main matrix)
#
#   ladder c -- task 02, exploration over a three-package scope (internal/shedbuild, internal/shedadapters,
#   internal/shedcheck), with shedadapters alone ~8.4k lines -- large enough to stress-test toc dir on a
#   directory too big to comfortably read file-by-file. This is the scope-axis midpoint between ladder a's
#   two packages and ladder d's whole repository. A toc win here at unchanged recall/precision would say
#   the effect generalises past two packages; a flat or worse result would say it does not.
#
#       c0-none      control
#       c1-toc-dir   directory-level toc only
#
#   ladder d -- task 06, a whole-repo, no-scope-hint exploration (config-file reconciliation against
#   templates). The prompt names no package at all, so this is the scope axis's other end: does a
#   cheap directory-level survey pay for itself most when the agent has no idea where to look? A toc
#   win here at unchanged recall/precision is the strongest form of the hypothesis this ladder tests.
#
#       d0-none      control
#       d1-toc-dir   directory-level toc only
#
# Deliberately NOT here:
#   - the file-level toc tool: it has no successor in the quarry MCP server's shipped surface, so
#     August's toc_dir+toc_file contrast (a3-toc-pair, 120k cache_read vs 71k for toc_dir alone) has no
#     cell to reconstruct here.
#   - a one-package exploration task, the scope axis's remaining gap between ladder a's two packages
#     and ladder c's three. It needs an exploration fasit (a reference-agent run) that does not exist
#     yet; `validate` imposes no cap on the number of ladder letters a file may carry, so adding it
#     later is a fifth `tasks:` entry and config group in this same file, not a second toc file.
#   - a "grep-toc" control: a no-tool cell whose prompt says `grep -n '^func\|^type' *.go` is fine.
#     That is the real competitor to toc and the cleanest test of whether the win is Quarry's output or
#     the map-first strategy. The harness renders one identical preamble for every cell and allows one
#     control per ladder letter, so a per-config prompt is a harness change rather than a configuration
#     change -- that harness change has not landed yet.
#   - annex delivery (pre-computed toc injected, zero tools) and the compact output form. Those are
#     HANDOFF.md §2a and §5 item 6 and need their own harness/engine work first.
#
# The server block below carries no args today. A future argument list may use the placeholder
# `{target_dir}`, for which the harness substitutes the pinned worktree path.
#
# reps 5, not 3: recall varied more than cost in August, and the question here is whether recall
# really is unchanged, not only whether cost drops.
#
# Reading the result: compare cost metrics rung vs control within this results root only. Correctness
# (recall/precision) may be compared by id against results/2026-08-30. If the toc cell's agent never
# used its tool, the per-cell table printed at the end says so; that cell is then a prompt-cost
# measurement, not a toc measurement.
#
# T2 proves the harness with `--cells a0-none --reps 1`. T7 runs `--cells a0-none,a2-toc-dir` at this
# file's own `reps: 5`.
#
# Run with:
#   go run ./bench/loomyard-eval/ladder/cmd/ladder run \
#     --config bench/loomyard-eval/ladder/ladder-toc.yaml \
#     --results bench/loomyard-eval/ladder/results/<date>-breadth \
#     --cells a0-none,a2-toc-dir,b0-none,b8-toc-dir,c0-none,c1-toc-dir,d0-none,d1-toc-dir

run_model: claude-sonnet-5
reps: 5
run_effort: medium
max_turns: 60

scorer:
  model: claude-opus-5
  effort: high

quarry_tools:
  - toc

server:
  name: quarry
  build: ./cmd/quarry-mcp

tasks:
  01-reed-geometry-exploration:
    task_file: bench/loomyard-eval/tasks/01-reed-geometry-exploration.md
    pinned_sha: 975578cda8d6f3a81580bd4e73725e060211b766
    schema: exploration
    fasit: bench/loomyard-eval/tasks/01-reed-geometry-exploration.fasit.json
  04-shedadapters-shuttle-impact:
    task_file: bench/loomyard-eval/tasks/04-shedadapters-shuttle-impact.md
    pinned_sha: 975578cda8d6f3a81580bd4e73725e060211b766
    schema: impact
    fasit: bench/loomyard-eval/tasks/04-shedadapters-shuttle-impact.fasit.json
  02-shedadapters-exploration:
    task_file: bench/loomyard-eval/tasks/02-shedadapters-exploration.md
    pinned_sha: 975578cda8d6f3a81580bd4e73725e060211b766
    schema: exploration
    fasit: bench/loomyard-eval/tasks/02-shedadapters-exploration.fasit.json
  06-loomyard-cold-start-orientation:
    task_file: bench/loomyard-eval/tasks/06-loomyard-cold-start-orientation.md
    pinned_sha: 975578cda8d6f3a81580bd4e73725e060211b766
    schema: exploration
    fasit: bench/loomyard-eval/tasks/06-loomyard-cold-start-orientation.fasit.json

# The harness itself resolves this environment variable at startup, falling back to the scratch env
# file when it is unset in the process environment.
source_repo: env:LADDER_LOOMYARD_REPO

configs:
  # Ladder a -- task 01, unfamiliar two-package exploration (where toc won in August)
  - id: a0-none
    ladder: a
    task: 01-reed-geometry-exploration
    allowed: []
  - id: a2-toc-dir
    ladder: a
    task: 01-reed-geometry-exploration
    allowed: [toc]

  # Ladder b -- task 04, the task text names the file (negative control for the map-first effect)
  - id: b0-none
    ladder: b
    task: 04-shedadapters-shuttle-impact
    allowed: []
  - id: b8-toc-dir
    ladder: b
    task: 04-shedadapters-shuttle-impact
    allowed: [toc]

  # Ladder c -- task 02, three-package exploration (scope-axis midpoint)
  - id: c0-none
    ladder: c
    task: 02-shedadapters-exploration
    allowed: []
  - id: c1-toc-dir
    ladder: c
    task: 02-shedadapters-exploration
    allowed: [toc]

  # Ladder d -- task 06, whole-repo exploration with no scope hint (scope-axis far end)
  - id: d0-none
    ladder: d
    task: 06-loomyard-cold-start-orientation
    allowed: []
  - id: d1-toc-dir
    ladder: d
    task: 06-loomyard-cold-start-orientation
    allowed: [toc]
